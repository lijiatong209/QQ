<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ聊天页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1E1E1E;
        }
        
        .phone-container {
            width: 1125px;
            height: 2436px;
            background: #F0F0F2;
            position: relative;
            overflow: hidden;
        }
        
        /* 背景图 - 最底层 */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('背景.png') no-repeat center top;
            background-size: cover;
            z-index: 1;
        }
        
        /* 视频 - 背景层上方 */
        .video-container {
            position: absolute;
            left: 522px;
            top: 264px;
            width: 820px;
            height: 580px;
            z-index: 2;
            overflow: hidden;
            pointer-events: none;
        }
        
        .video-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            display: block;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        /* 消息图片 - 视频上层 */
        .message-img {
            position: absolute;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 3;
            height: 127px;
        }
        
        .message-img.show {
            opacity: 1;
            transform: scale(1);
        }
        
        /* 图片位置 */
        .img-1 { top: 297px; left: 36px; }
        .img-2 { top: 477px; left: 36px; }
        .img-3 { top: 657px; left: 36px; }
        .img-4 { top: 837px; right: 36px; }
        .img-5 { top: 1017px; left: 36px; }
        .img-6 { top: 1197px; left: 36px; }
        .img-7 { top: 1377px; right: 36px; }
        .img-8 { top: 1557px; left: 36px; }
        
        .message-img img {
            height: 100%;
            width: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- 背景 -->
        <div class="background"></div>
        
        <!-- GIF -->
        <div class="video-container">
            <img id="main-gif" src="gif.gif" alt="animation">
        </div>
        
        <!-- 消息图片 -->
        <div class="message-img img-1" id="msg-1">
            <img src="1.png" alt="message 1">
        </div>
        <div class="message-img img-2" id="msg-2">
            <img src="2.png" alt="message 2">
        </div>
        <div class="message-img img-3" id="msg-3">
            <img src="3.png" alt="message 3">
        </div>
        <div class="message-img img-4" id="msg-4">
            <img src="4.png" alt="message 4">
        </div>
        <div class="message-img img-5" id="msg-5">
            <img src="5.png" alt="message 5">
        </div>
        <div class="message-img img-6" id="msg-6">
            <img src="6.png" alt="message 6">
        </div>
        <div class="message-img img-7" id="msg-7">
            <img src="7.png" alt="message 7">
        </div>
        <div class="message-img img-8" id="msg-8">
            <img src="8.png" alt="message 8">
        </div>
    </div>
    
    <script>
        const messages = [
            document.getElementById('msg-1'),
            document.getElementById('msg-2'),
            document.getElementById('msg-3'),
            document.getElementById('msg-4'),
            document.getElementById('msg-5'),
            document.getElementById('msg-6'),
            document.getElementById('msg-7'),
            document.getElementById('msg-8')
        ];
        
        const mainGif = document.getElementById('main-gif');
        
        // 页面加载后自动开始
        window.addEventListener('load', () => {
            // 图1立即弹出
            messages[0].classList.add('show');
            
            // 图2-8按0.8s间隔弹出
            for (let i = 1; i < messages.length; i++) {
                setTimeout(() => {
                    messages[i].classList.add('show');
                }, i * 800);
            }
            
            // 第0.5s时显示GIF
            setTimeout(() => {
                mainGif.style.opacity = '1';
            }, 500);
        });
    </script>
</body>
</html>
